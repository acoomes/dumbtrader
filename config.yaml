# DumbTrader global configuration
# Environment variables are interpolated from .env or the shell environment.

api:
  username: ${PROJECT_X_USERNAME}
  api_key: ${PROJECT_X_API_KEY}

trading:
  mode: live           # "paper" or "live"
  instrument: MNQ
  timeframe: 5min
  max_position_size: 2

strategy:
  file: strategies/ema_crossover.yaml   # or .pine file
