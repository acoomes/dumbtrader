[project]
name = "dumbtrader"
version = "0.1.0"
description = "Futures trading bot using ProjectX"
requires-python = ">=3.11"
dependencies = [
    "project-x-py",
    "pyyaml",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "aiosqlite",
]

[project.scripts]
dumbtrader = "dumbtrader.main:main"
dumbtrader-loop = "dumbtrader.agentic.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
